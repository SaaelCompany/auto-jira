com.codebarrel.automation.rule.error.cant.branch.no.context=A szabályt nem lehet leágaztatni, mert ehhez a lehetőséghez ügy(ek)re van szükség a környezetben. Feltehetően olyan eseményindító van megadva, amely nem szúr be ügyeket a szabályláncba. pl. Az ütemezett szabály nem futtat JQL-lekérdezést. Egy ügy létrehozása még nem helyezi az ügyet a környezetbe – közvetlenül le kell ágaztatni.
com.codebarrel.automation.rule.error.cant.branch.no.input.version=A szabályt nem lehet leágaztatni, mert ehhez a lehetőséghez verzióra van szükség a környezetben. Feltehetően olyan eseményindító van megadva, amely nem verzióhoz kapcsolódó. Egy verzió létrehozása még nem helyezi a verziót a környezetbe – közvetlenül le kell ágaztatni.
com.codebarrel.automation.rule.error.cant.branch.no.input.sprint=Nem lehet leágazni a szabályhoz, mert ehhez a lehetőséghez sprintre van szükség a környezetben. Feltehetően olyan eseményindító van megadva, amely nem sprinthez kapcsolódó.
com.codebarrel.automation.rule.error.cant.branch.no.input.destination.issue=A szabályt nem lehet leágaztatni, mert ehhez a lehetőséghez célügyre van szükség a környezetben. Feltehetően nem az ügyhöz kapcsolt eseményindítót használod, vagy nem érhető el a célügy.
com.codebarrel.automation.rule.error.cant.branch.no.input.created.issues=A szabályt nem lehet leágaztatni, mert olyan ügyeket igényel, amelyeket korábban ez a szabály hozott létre. Feltehetően még nem hoztál létre ügyet, vagy az ügy(ek)et egy másik if blokkban vagy leágazásnál hozták létre, és ebben az esetben az adott blokkon vagy leágazáson kívül nem láthatóak.
com.codebarrel.automation.rule.error.cant.branch.no.children=A szabályt nem lehet leágaztatni, mert egyelőre nincs hozzáadva feltétel vagy művelet. Töröld a leágazást, vagy adj hozzá néhány komponenst.
