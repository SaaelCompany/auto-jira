com.codebarrel.automation.rule.details.legacy.desc.two=Sett alle komponenter til å bruke den nye smartverdigjengivelsen først, for å kun benytte denne regelen for et spesifikt produkt.

com.codebarrel.automation.error.request=Det oppsto en ukjent feil da vi prøvde å forespørre stien.
com.codebarrel.automation.error.unknown=Det oppsto en ukjent feil. Last inn på nytt og prøv igjen.
