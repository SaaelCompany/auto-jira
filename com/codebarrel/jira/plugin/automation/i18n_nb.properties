com.codebarrel.automation.rule.error.name=Skriv inn et navn på denne regelen.
com.codebarrel.automation.rule.error.name.length=Regelnavnet må bestå av mindre enn 255 tegn.
com.codebarrel.automation.rule.error.project.select=Velg et prosjekt denne automatiseringen skal gjelde for.
com.codebarrel.automation.rule.error.project.type.select=Velg en prosjekttype denne automatiseringen skal gjelde for.
