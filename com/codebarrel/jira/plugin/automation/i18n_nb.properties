com.codebarrel.automation.rule.error.action.comparator.second.invalid.regex=Verdien må inneholde et gyldig regulært uttrykk
com.codebarrel.automation.rule.error.action.comparator.invalid.regex=Ugyldig regulært uttrykk:
com.codebarrel.automation.rule.error.cant.run=Ingen saker ble funnet. Regelen stanses.
com.codebarrel.automation.rule.error.cant.run.no.context=Kunne ikke kjøre komponenten, da dette krever sak(er) i konteksten. Du har mest sannsynlig en utløser som ikke setter inn saker i regelkjeden. f.eks. Den planlagte regelen kjører ikke en JQL-spørring. En sak blir ikke satt direkte inn i konteksten når den blir opprettet – du må opprette en gren for at den skal oppdateres.
com.codebarrel.automation.rule.error.cant.branch.no.context=Kan ikke opprette en gren for regelen, da dette alternativet krever sak(er) i konteksten. Du har mest sannsynlig en utløser som ikke setter inn saker i regelkjeden. f.eks. Den planlagte regelen kjører ikke en JQL-spørring. En sak blir ikke satt direkte inn i konteksten når den blir opprettet – du må opprette en gren direkte.
com.codebarrel.automation.rule.error.cant.branch.no.input.version=Kan ikke opprette en gren for regelen, da dette alternativet krever en versjon i konteksten. Du har mest sannsynlig en utløser som ikke er versjonsrelatert. En versjon blir ikke satt direkte inn i konteksten når den blir opprettet – du må opprette en gren direkte.
com.codebarrel.automation.rule.error.cant.branch.no.input.sprint=Kan ikke opprette en gren for regelen, da dette alternativet krever en sprint i konteksten. Du har mest sannsynlig en utløser som ikke er sprintrelatert.
com.codebarrel.automation.rule.error.cant.branch.no.input.destination.issue=Kan ikke opprette en gren for regelen, da dette krever en destinasjonssak i konteksten. Mest sannsynlig bruker du ikke utløseren for saken som er koblet til, eller destinasjonssaken er ikke tilgjengelig.
com.codebarrel.automation.rule.error.cant.branch.no.input.created.issues=Kan ikke opprette en gren for regelen, da den krever at saker tidligere er opprettet av denne regelen. Du har mest sannsynlig ikke opprettet en sak ennå, eller saken(e) ble opprettet i en annen «If»-blokk eller -gren – disse vil da ikke være synlige utenfor den blokken/grenen.
com.codebarrel.automation.rule.error.cant.branch.no.children=Kan ikke opprette en gren for regelen, da ingen betingelser/handlinger er konfigurert for den. Du må enten slette grenen eller legge til flere komponenter for den.
com.codebarrel.automation.rule.error.project.scope.invalid=Prosjektomfanget for denne regelen er ugyldig
com.codebarrel.automation.rule.edit.warn=Du redigerer for øyeblikket en automatiseringsregel. Hvis du navigerer bort herfra, vil du miste endringene dine. Er du sikker på at du vil fortsette?
com.codebarrel.automation.rule.delete.warn=Når regelen er slettet, kan du ikke gjenopprette den. Er du sikker på at du vil fortsette?
com.codebarrel.automation.rule.discard.warn=Når regelen er forkastet, kan du ikke gjenopprette den. Er du sikker på at du vil fortsette?
com.codebarrel.automation.rule.revert.warn=Når endringer er forkastet, kan du ikke gjenopprette dem. Er du sikker på at du vil fortsette?
com.codebarrel.automation.rule.branch.warn.no.created=Grenen ble ikke gjennomført, fordi regelen ikke opprettet noen saker. Var det meningen å legge til en Opprett sak-handling?
com.codebarrel.automation.rule.branch.warn.restrict.projects=Denne regelen ble konfigurert med en prosjektbegrensning. Du kan endre denne begrensningen i delen «Regeldetaljer». Det er kun saker fra følgende prosjekter eller prosjekttyper som blir vurdert:
com.codebarrel.automation.rule.branch.warn.restrict.projects.picker.label=Regel begrenset til prosjekter
com.codebarrel.automation.rule.branch.warn.restrict.projects.picker.desc=Det er kun saker fra prosjektene ovenfor som blir vurdert. Du kan endre denne begrensningen i delen «Regeldetaljer».
com.codebarrel.automation.rule.branch.warn.restrict.project.type.picker.label=Regel begrenset til prosjekttype
com.codebarrel.automation.rule.branch.warn.restrict.project.type.picker.desc=Det er kun saker av prosjekttypen ovenfor som blir vurdert. Du kan endre denne begrensningen i delen «Regeldetaljer».

com.codebarrel.automation.empty.no.perm.title=Dette prosjektet har ingen regler ennå
