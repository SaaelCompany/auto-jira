com.codebarrel.automation.rule.error.components.not.registered=Det er ikke registrert noen komponenter med typen «{0}» i systemet.
com.codebarrel.automation.rule.error.components.no.actions=Automatiseringsregelen må inneholde minst én gyldig handling.
com.codebarrel.automation.rule.error.trigger.type=Regelhendelsestypen «{0}» er ikke gyldig. Utløsere må enten være planlagte eller hendelsesbaserte.
