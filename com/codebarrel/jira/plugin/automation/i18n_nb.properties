com.codebarrel.automation.rule.legacy.desc1=Denne komponenten ble oppgradert fra den gamle Atlassian Labs-appen, og bruker for øyeblikket den eldre Velocity-gjengivelsen til å gjengi feltverdier.
com.codebarrel.automation.rule.legacy.desc2=Konverter denne komponenten for å bruke den nye {0}smartverdisyntaksen{1} for Automation for Jira i feltene nedenfor. Deretter kan du slå på smartverdigjengivelse:
