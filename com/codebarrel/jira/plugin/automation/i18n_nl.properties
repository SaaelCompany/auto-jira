com.codebarrel.automation.rule.error.cant.run=Er zijn geen issues gevonden, de regel wordt stopgezet.
com.codebarrel.automation.rule.error.cant.run.no.context=Component kan niet uitgevoerd worden omdat er issues binnen de context nodig zijn. Mogelijk heb je een trigger die geen issues invoert in de regelketen. Bijv. Geplande regel voert geen JQL-query uit. Door een issue aan te maken wordt deze niet in context geplaatst. Om de issue bij te werken moet je een branch maken.
com.codebarrel.automation.rule.error.cant.branch.no.context=Kan geen branch maken voor regel omdat er issues voor nodig zijn binnen de context van deze optie. Mogelijk heb je een trigger die geen issues invoert in de regelketen. Bijv. Geplande regel voert geen JQL-query uit. Door een issue aan te maken wordt deze niet in context geplaatst. Je moet daar direct een branch voor maken.
com.codebarrel.automation.rule.error.cant.branch.no.input.version=Kan geen branch maken voor regel omdat er een versie voor nodig is binnen de context van deze optie. Mogelijk heb je een trigger die niet te maken heeft met de versie. Door een versie aan te maken wordt deze niet in context geplaatst. Je moet daar direct een branch voor maken.
com.codebarrel.automation.rule.error.cant.branch.no.input.sprint=Kan geen branch maken voor regel omdat er een sprint voor nodig is binnen de context van deze optie. Mogelijk heb je een trigger die niet te maken heeft met de sprint.
com.codebarrel.automation.rule.error.cant.branch.no.input.destination.issue=Kan geen branch maken voor regel omdat er een bestemmingsissue voor nodig is binnen de context van deze optie. Mogelijk gebruik je niet de trigger die gekoppeld is aan de issue of is de bestemmingsissue niet beschikbaar.
com.codebarrel.automation.rule.error.cant.branch.no.input.created.issues=Kan geen branch maken voor regel omdat er eerst issues aangemaakt moeten zijn door deze regel. Mogelijk heb je nog geen issue aangemaakt of zijn issues aangemaakt in een ander ''if''-blok of een andere ''if''-branch. Deze zijn dan niet zichtbaar buiten dat blok/die branch.
com.codebarrel.automation.rule.error.cant.branch.no.children=Kan geen branch maken voor regel omdat er geen voorwaarden/acties voor geconfigureerd zijn. Verwijder branch of voeg een aantal componenten toe voor de branch.
