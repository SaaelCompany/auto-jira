com.codebarrel.automation.rule.error.cant.run=Nenhum item foi encontrado, interrompendo a regra.
com.codebarrel.automation.rule.error.cant.run.no.context=Não é possível executar o componente, pois ele requer itens no contexto. É provável que você tenha algum acionador que não insere itens na cadeia de regras. Por exemplo, A regra agendada não está executando a consulta JQL. Criar itens não os coloca no contexto, você precisa fazer a ramificação e a atualização do item.
com.codebarrel.automation.rule.error.cant.branch.no.context=Não é possível ramificar a regra, pois ela requer itens no contexto para esta opção. É provável que você tenha algum acionador que não insere itens na cadeia de regras. Por exemplo, a regra agendada não está executando a consulta JQL. Criar itens não os coloca no contexto. Você precisa fazer a ramificação direta.
com.codebarrel.automation.rule.error.cant.branch.no.input.version=Não é possível ramificar a regra, pois ela requer uma versão no contexto para esta opção. É provável que você tenha um acionador que não está relacionado à versão. Criar uma versão não a coloca em contexto. Você precisa fazer a ramificação direta.
com.codebarrel.automation.rule.error.cant.branch.no.input.sprint=Não é possível ramificar a regra, pois ela requer um sprint no contexto para esta opção. É provável que você tenha um acionador que não está acionado a sprint.
com.codebarrel.automation.rule.error.cant.branch.no.input.destination.issue=Não é possível ramificar a regra, pois ela requer um item de destino no contexto para esta opção. É provável que você não esteja usando o acionador vinculado a item ou que o item de destino não esteja disponível.
com.codebarrel.automation.rule.error.cant.branch.no.input.created.issues=Não é possível ramificar esta regra, pois ela requer que itens tenham sido criados antes por esta regra. É provável que você ainda não tenha criado o item ou que ele tenha sido criado em outro bloco ou ramificação "If", não estando visível fora de tal bloco/ramificação.
com.codebarrel.automation.rule.error.cant.branch.no.children=Não é possível ramificar a regra, pois não foram configuradas condições/ações para ela. Exclua a ramificação ou adicione alguns componentes para ela.
