com.codebarrel.automation.rule.error.cant.branch.no.context=Pravidlo nelze větvit, protože pro tuto možnost vyžaduje požadavky v kontextu. S největší pravděpodobností máte spouštěč, který do řetězce pravidel nevkládá požadavky. například: Naplánované pravidlo nespouští dotaz JQL. Vytvoření požadavku nevloží požadavek do kontextu. Je potřeba přímo provést větvení.
com.codebarrel.automation.rule.error.cant.branch.no.input.version=Pravidlo nelze větvit, protože pro tuto možnost vyžaduje verzi v kontextu. S největší pravděpodobností máte spouštěč, který se nevztahuje k verzím. Vytvoření verze ji nevloží do kontextu. Je potřeba přímo provést větvení.
com.codebarrel.automation.rule.error.cant.branch.no.input.sprint=Pravidlo nelze větvit, protože pro tuto možnost vyžaduje sprint v kontextu. S největší pravděpodobností máte spouštěč, který se nevztahuje ke sprintům.
com.codebarrel.automation.rule.error.cant.branch.no.input.destination.issue=Pravidlo nelze větvit, protože pro tuto možnost vyžaduje cílový požadavek v kontextu. S největší pravděpodobností nepoužíváte spouštěč napojený na požadavek nebo je cílový požadavek nedostupný.
com.codebarrel.automation.rule.error.cant.branch.no.input.created.issues=Pravidlo nelze větvit, protože vyžaduje, aby jím byly dříve vytvořeny požadavky. S největší pravděpodobností jste ještě nevytvořili požadavek nebo požadavky byly vytvořeny v jiné větvi nebo bloku if. Takové požadavky nebudou mimo danou větev/blok viditelné.
com.codebarrel.automation.rule.error.cant.branch.no.children=Pravidlo nelze větvit, protože pro něj nebyly konfigurovány žádné podmínky/akce. Buď větev odstraňte, nebo pro ni přidejte nějaké komponenty.
