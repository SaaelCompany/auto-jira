com.codebarrel.automation.rule.error.cant.run=Asioita ei löytynyt. Sääntö pysäytetään.
com.codebarrel.automation.rule.error.cant.run.no.context=Komponentin suorittaminen ei onnistu, sillä se edellyttää kontekstissa olevia asioita. Mitä todennäköisimmin sinulla on laukaisin, joka ei lisää asioita sääntöketjuun. esim. Ajoitettu sääntö ei suorita JQL-kyselyä. Asian luominen ei aseta asiaa kontekstiin, vaan sinun on päivitettävä asia haaroittamalla se.
com.codebarrel.automation.rule.error.cant.branch.no.context=Säännön haaroittaminen ei onnistu, sillä se edellyttää tämän vaihtoehdon kontekstissa olevia asioita. Mitä todennäköisimmin sinulla on laukaisin, joka ei lisää asioita sääntöketjuun. esim. Ajoitettu sääntö ei suorita JQL-kyselyä. Asian luominen ei aseta asiaa kontekstiin, vaan sinun on haaroitettava siitä suoraan.
com.codebarrel.automation.rule.error.cant.branch.no.input.version=Säännön haaroittaminen ei onnistu, sillä se edellyttää tämän vaihtoehdon kontekstissa olevaa versiota. Mitä todennäköisimmin sinulla on laukaisin, joka ei liity versioon. Version luominen ei aseta versiota kontekstiin, vaan sinun on haaroitettava siitä suoraan.
com.codebarrel.automation.rule.error.cant.branch.no.input.sprint=Säännön haaroittaminen ei onnistu, sillä se edellyttää tämän vaihtoehdon kontekstissa olevaa sprinttiä. Mitä todennäköisimmin sinulla on laukaisin, joka ei liity sprinttiin.
com.codebarrel.automation.rule.error.cant.branch.no.input.destination.issue=Säännön haaroittaminen ei onnistu, sillä se edellyttää tämän vaihtoehdon kontekstissa olevaa kohdeasiaa. Mitä todennäköisimmin et käytä asiaan linkitettyä laukaisinta tai kohdeasia ei ole käytettävissä.
com.codebarrel.automation.rule.error.cant.branch.no.input.created.issues=Säännön haaroittaminen ei onnistu, sillä se edellyttää, että tämän säännön avulla on aiemmin luotu asioita. Mitä todennäköisimmin et ole vielä luonut asiaa tai asia(t) luotiin toisessa Jos-lohkossa tai haarassa – mikäli näin on, ne eivät näy kyseisen lohkon/haaran ulkopuolella.
